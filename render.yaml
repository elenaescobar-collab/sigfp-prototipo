# Despliegue del prototipo en Render (plan gratuito).
services:
  - type: web
    name: sigfp
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python -m spacy download es_core_news_sm &&
      python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py cargar_demo && gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: sigfp-db
          property: connectionString

databases:
  - name: sigfp-db
    plan: free
    databaseName: sigfp_db
    user: sigfp
